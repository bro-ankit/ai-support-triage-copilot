services:
  db:
    image: pgvector/pgvector:pg16
    container_name: support_triage_db
    restart: unless-stopped
    ports:
      - '5435:5432'
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-support_triage_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-support_triage_db}']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
